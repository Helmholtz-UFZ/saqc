# ===========================================================
# Hints
# ===========================================================

# $TESTPYPI_TOKEN
#   The upload token used for testpypi, set it on the gitlab
#   page and enable masking to prevent revealing

# $PYPI_TOKEN
#   The upload token used for production PyPI releases. Configure it as a
#   masked and protected GitLab variable, and protect release tags.

# ===========================================================
# preparation
# ===========================================================

variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - compliance
  - test
  - build
  - deploy

default:
  image: python:3.13
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r tests/requirements.txt
    - apt update
    - apt install -y xvfb

# ===========================================================
# Compliance stage
# ===========================================================

# check if everything is properly formatted
black:
  stage: compliance
  script:
    - pip install black
    - black --check .

# check if imports are sorted
isort:
  stage: compliance
  script:
    - pip install isort
    - isort --check .

# Check compliance with the REUSE specification
reuse:
  stage: compliance
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  before_script:
    - echo "Override default 'before_script'..."
  script:
    - reuse lint


# ===========================================================
# Testing stage
# ===========================================================

# make (visual) coverage in gitlab merge request diff's
coverage:
  stage: test
  allow_failure: true
  script:
    - export DISPLAY=:99
    - Xvfb :99 &
    - pip install pytest-cov coverage
    - pytest --cov=saqc tests --ignore=tests/fuzzy --ignore=tests/extras -Werror
  after_script:
    - coverage xml
  # regex to find the coverage percentage in the job output
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml


python311:
  stage: test
  image: python:3.11
  script:
    - export DISPLAY=:99
    - Xvfb :99 &
    - pytest tests -Werror --junitxml=report.xml --ignore=tests/extras
    - python -m saqc --config docs/resources/data/config.csv --data docs/resources/data/data.csv --outfile /tmp/test.csv
  artifacts:
    when: always
    reports:
      junit: report.xml

python312:
  stage: test
  image: python:3.12
  script:
    - export DISPLAY=:99
    - Xvfb :99 &
    - pytest tests -Werror --junitxml=report.xml --ignore=tests/extras
    - python -m saqc --config docs/resources/data/config.csv --data docs/resources/data/data.csv --outfile /tmp/test.csv
  artifacts:
    when: always
    reports:
      junit: report.xml

python313:
  stage: test
  image: python:3.13
  script:
    - export DISPLAY=:99
    - Xvfb :99 &
    - pytest tests -Werror --junitxml=report.xml --ignore=tests/extras
    - python -m saqc --config docs/resources/data/config.csv --data docs/resources/data/data.csv --outfile /tmp/test.csv
  artifacts:
    when: always
    reports:
      junit: report.xml

python314:
  stage: test
  image: python:3.14
  script:
    - export DISPLAY=:99
    - Xvfb :99 &
    - pytest tests -Werror --junitxml=report.xml --ignore=tests/extras
    - python -m saqc --config docs/resources/data/config.csv --data docs/resources/data/data.csv --outfile /tmp/test.csv
  artifacts:
    when: always
    reports:
      junit: report.xml

doctest:
  stage: test
  variables:
    COLUMNS: 200
  script:
    - cd docs
    - pip install -r requirements.txt
    - make doc  # needed for _api tests
    - make test


# ===========================================================
# Building stage
# ===========================================================
# check if we are able to build a wheel
# and if the import works
wheel311:
  stage: build
  image: python:3.11
  script:
    - pip install wheel
    - pip wheel .
    - pip install .
    - python -c 'import saqc; print(f"{saqc.__version__=}")'

wheel312:
  stage: build
  image: python:3.12
  script:
    - pip install wheel
    - pip wheel .
    - pip install .
    - python -c 'import saqc; print(f"{saqc.__version__=}")'

wheel313:
  stage: build
  image: python:3.13
  script:
    - pip install wheel
    - pip wheel .
    - pip install .
    - python -c 'import saqc; print(f"{saqc.__version__=}")'

wheel314:
  stage: build
  image: python:3.14
  script:
    - pip install wheel
    - pip wheel .
    - pip install .
    - python -c 'import saqc; print(f"{saqc.__version__=}")'

release_dist:
  stage: build
  image: python:3.13
  before_script: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - pip install --upgrade pip
    - pip install build twine
    - python -m build --outdir release-dist
    - test -f "release-dist/saqc-${CI_COMMIT_TAG#v}-py3-none-any.whl"
    - test -f "release-dist/saqc-${CI_COMMIT_TAG#v}.tar.gz"
    - twine check --strict release-dist/*
  artifacts:
    expire_in: 1 week
    paths:
      - release-dist/

# ===========================================================
# Extra Pipeline (run with a successful run of all other jobs on develop)
# ===========================================================

upload_testpypi:
  stage: deploy
  only:
    - develop
  except:
    - schedules
  variables:
    TWINE_USERNAME: "__token__"
    TWINE_PASSWORD: $TESTPYPI_TOKEN
  script:
    - pip install build twine
    - python -m build --outdir test-dist
    - twine check --strict test-dist/*
    - twine upload -r testpypi test-dist/*

publish_pypi:
  stage: deploy
  image: python:3.13
  before_script: []
  needs:
    - job: release_dist
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - when: never
  allow_failure: false
  variables:
    TWINE_USERNAME: "__token__"
    TWINE_PASSWORD: $PYPI_TOKEN
  script:
    - pip install --upgrade pip
    - pip install twine
    - twine check --strict release-dist/*
    - twine upload release-dist/*
  environment:
    name: pypi


# make html docu with sphinx
pages:
  stage: deploy
  only:
    - main
  except:
    - schedules
  script:
    - cd docs/
    - pip install -r requirements.txt
    - make doc
    - cp -r _build/html ../public
  artifacts:
    paths:
      - public
